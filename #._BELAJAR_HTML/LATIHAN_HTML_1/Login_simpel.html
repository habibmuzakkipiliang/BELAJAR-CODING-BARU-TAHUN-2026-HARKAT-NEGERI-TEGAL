<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Sederhana</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<style>
    .body {
        font-size: medium;
        font-family: sans-serif;
        line-height: 3.5em;
    }

    .header {
        font-family: sans-serif;
        font-size: medium;
        line-height: 3.5em;
    }
</style>
<body class="body bg-danger">

    <header class="header p-5 mb-5 h-100 bg-info">
        <h1 class="text-center text-white">
            Login Sederhana dan Mudah
        </h1>
    </header>

    <div class="container">
        <div class="row">
            <div class="col-sm-12 bg-white">

                <form action="">
                    <div class="mb-3">
                        <label for="">Email :</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="">Password</label>
                        <input type="password" class="form-control" id="">
                    </div>
                    <div class="mb-3">
                        <label for="">Nama kamu :</label>
                        <input type="text" class="form-control" id="">
                    </div>
                    <div class="mb-3">
                        <label for="">Asal daerah kamu : </label>
                        <input type="text" class="form-control" id="">

                        <div class="py-3"></div>

                        <input type="button" value="submit" class="btn btn-dark" style="font-size: 30px;">
                        <input type="button" value="Kirim" class="btn btn-info" style="font-size: 30px;">
                    </div>
                </form>
            </div>
        </div>
    </div>
    <br>

    <footer class="footer m-auto p-5 h-100 bg-dark">
        <span class="text-center text-white h-100">
            Copyright &copy; Habib Muzakki. D4 Teknik Informatika. All rights reserved.
        </span>
    </footer>


</body>
</html>
